name: VC tests

on:
  push:
  pull_request:

jobs:
  vc-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Install Maven 3.8.8
        run: |
          curl -fsSL -o /tmp/maven.tgz https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.8.8/apache-maven-3.8.8-bin.tar.gz
          mkdir -p "$HOME/maven"
          tar -xzf /tmp/maven.tgz -C "$HOME/maven"
          echo "$HOME/maven/apache-maven-3.8.8/bin" >> "$GITHUB_PATH"
      - name: Run analysis service tests
        run: mvn -pl VC,ers,nlg,PROVSIMP -am test
