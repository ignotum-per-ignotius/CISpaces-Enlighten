# CISpaces workbench plus the services the workbench image does not start.
# PostgreSQL, RabbitMQ, and fact extraction share the workbench network
# namespace, so FEWS keeps using localhost:5432 and localhost:5672.
# The workbench image still runs on its own with only CISPACES_DERBY_PASSWORD.
#
# Export the three CISPACES_* passwords (or put them in a gitignored .env)
# before `docker compose up`. They are not written into this file.

services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: cispaces-enlighten:local
    ports:
      - "8080:8080"
    environment:
      CISPACES_DERBY_PASSWORD: ${CISPACES_DERBY_PASSWORD:?Set CISPACES_DERBY_PASSWORD}
      CISPACES_POSTGRES_PASSWORD: ${CISPACES_POSTGRES_PASSWORD:?Set CISPACES_POSTGRES_PASSWORD}
      CISPACES_RABBITMQ_PASSWORD: ${CISPACES_RABBITMQ_PASSWORD:?Set CISPACES_RABBITMQ_PASSWORD}
    volumes:
      - cispaces-derby:/opt/cispaces/data/derby
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  postgres:
    build: ./docker/postgres
    network_mode: service:workbench
    depends_on:
      - workbench
    environment:
      CISPACES_POSTGRES_PASSWORD: ${CISPACES_POSTGRES_PASSWORD:?Set CISPACES_POSTGRES_PASSWORD}
    volumes:
      - cispaces-postgres:/var/lib/postgresql/data
      - ./FEWS/extra/create_vocab_tables.sql:/opt/cispaces/sql/create_vocab_tables.sql:ro
      - ./FEWS/extra/intelanalysis_factextract_vocab_topic.sql:/opt/cispaces/sql/intelanalysis_factextract_vocab_topic.sql:ro
      - ./FEWS/extra/intelanalysis_factextract_vocab_keyword.sql:/opt/cispaces/sql/intelanalysis_factextract_vocab_keyword.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -d intelanalysis && test -f /var/lib/postgresql/data/cispaces.seeded"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 120s

  rabbitmq:
    build: ./docker/rabbitmq
    network_mode: service:workbench
    depends_on:
      - workbench
    environment:
      CISPACES_RABBITMQ_PASSWORD: ${CISPACES_RABBITMQ_PASSWORD:?Set CISPACES_RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && test -f /var/lib/rabbitmq/cispaces.ready"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  fact-extraction:
    build: ./docker/fact-extraction
    network_mode: service:workbench
    depends_on:
      workbench:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      CISPACES_POSTGRES_PASSWORD: ${CISPACES_POSTGRES_PASSWORD:?Set CISPACES_POSTGRES_PASSWORD}
      CISPACES_RABBITMQ_PASSWORD: ${CISPACES_RABBITMQ_PASSWORD:?Set CISPACES_RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/fact-extraction.ready"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  cispaces-derby:
  cispaces-postgres:
